# Legacy GitBook page URLs only. This intentionally excludes JS, CSS, images, and other assets.
# Old locale IDs: en_US -> en, zh_cn -> zh-Hans, zh_TW -> zh-Hant, ja_JP -> ja.

# The old plugin overview used plugins/plugins.html; the new overview route is /docs/plugins/.
rewrite (?i)^/en_us/plugins/plugins(?:\.html|/?)$ https://doc.rebocap.com/docs/plugins/ permanent;
rewrite (?i)^/zh_cn/plugins/plugins(?:\.html|/?)$ https://doc.rebocap.com/zh-Hans/docs/plugins/ permanent;
rewrite (?i)^/zh_tw/plugins/plugins(?:\.html|/?)$ https://doc.rebocap.com/zh-Hant/docs/plugins/ permanent;
rewrite (?i)^/ja_jp/plugins/plugins(?:\.html|/?)$ https://doc.rebocap.com/ja/docs/plugins/ permanent;

# Locale roots and GitBook index/README pages.
rewrite (?i)^/en_us/?$ https://doc.rebocap.com/docs/ permanent;
rewrite (?i)^/en_us/(?:index|readme)\.html$ https://doc.rebocap.com/docs/ permanent;
rewrite (?i)^/en_us/(?!reborn_access(?:/|\.html$|$))(.+)/(?:index|readme)\.html$ https://doc.rebocap.com/docs/$1/ permanent;
rewrite (?i)^/en_us/(?!reborn_access(?:/|\.html$|$))(.+)\.html$ https://doc.rebocap.com/docs/$1/ permanent;
rewrite (?i)^/en_us/(?!reborn_access(?:/|\.html$|$))((?:[^/]+/)*)([^/.]+)/$ https://doc.rebocap.com/docs/$1$2/ permanent;

rewrite (?i)^/zh_cn/?$ https://doc.rebocap.com/zh-Hans/docs/ permanent;
rewrite (?i)^/zh_cn/(?:index|readme)\.html$ https://doc.rebocap.com/zh-Hans/docs/ permanent;
rewrite (?i)^/zh_cn/(?!reborn_access(?:/|\.html$|$))(.+)/(?:index|readme)\.html$ https://doc.rebocap.com/zh-Hans/docs/$1/ permanent;
rewrite (?i)^/zh_cn/(?!reborn_access(?:/|\.html$|$))(.+)\.html$ https://doc.rebocap.com/zh-Hans/docs/$1/ permanent;
rewrite (?i)^/zh_cn/(?!reborn_access(?:/|\.html$|$))((?:[^/]+/)*)([^/.]+)/$ https://doc.rebocap.com/zh-Hans/docs/$1$2/ permanent;

rewrite (?i)^/zh_tw/?$ https://doc.rebocap.com/zh-Hant/docs/ permanent;
rewrite (?i)^/zh_tw/(?:index|readme)\.html$ https://doc.rebocap.com/zh-Hant/docs/ permanent;
rewrite (?i)^/zh_tw/(?!reborn_access(?:/|\.html$|$))(.+)/(?:index|readme)\.html$ https://doc.rebocap.com/zh-Hant/docs/$1/ permanent;
rewrite (?i)^/zh_tw/(?!reborn_access(?:/|\.html$|$))(.+)\.html$ https://doc.rebocap.com/zh-Hant/docs/$1/ permanent;
rewrite (?i)^/zh_tw/(?!reborn_access(?:/|\.html$|$))((?:[^/]+/)*)([^/.]+)/$ https://doc.rebocap.com/zh-Hant/docs/$1$2/ permanent;

rewrite (?i)^/ja_jp/?$ https://doc.rebocap.com/ja/docs/ permanent;
rewrite (?i)^/ja_jp/(?:index|readme)\.html$ https://doc.rebocap.com/ja/docs/ permanent;
rewrite (?i)^/ja_jp/(?!reborn_access(?:/|\.html$|$))(.+)/(?:index|readme)\.html$ https://doc.rebocap.com/ja/docs/$1/ permanent;
rewrite (?i)^/ja_jp/(?!reborn_access(?:/|\.html$|$))(.+)\.html$ https://doc.rebocap.com/ja/docs/$1/ permanent;
rewrite (?i)^/ja_jp/(?!reborn_access(?:/|\.html$|$))((?:[^/]+/)*)([^/.]+)/$ https://doc.rebocap.com/ja/docs/$1$2/ permanent;
